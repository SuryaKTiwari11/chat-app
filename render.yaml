# render.yaml
services:
  # Backend API service
  - type: web
    name: chat-app-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PRODUCTION_URL
        sync: false  # Frontend static site
  - type: web
    name: chat-app-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    rootDir: frontend
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
