services:
  # Backend API service
  - type: web
    name: chat-app-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: chat-app-frontend
          type: static
          property: url
      - key: PRODUCTION_URL
        fromService:
          name: chat-app-frontend
          type: static
          property: url

  # Frontend static site
  - type: static
    name: chat-app-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: chat-app-backend
          type: web
          property: url
